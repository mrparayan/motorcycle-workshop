name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Add native code and fixed signing key
        run: |
          D=android/app/src/main/java/com/workshop/billing
          mkdir -p $D ~/.android
          cp native/*.java $D/
          cp native/debug.keystore ~/.android/debug.keystore
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.documentfile:documentfile:1.0.1"/' android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WorkshopBilling-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
